service: knowledgeflow-ai-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

  # IAM role permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/*"

        - Effect: Allow
          Action:
            - rds-db:connect
          Resource: "arn:aws:rds:${aws:region}:${aws:accountId}:db/*"

        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::${env:S3_BUCKET}/*"

        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: "arn:aws:bedrock:${aws:region}::foundation-model/anthropic.claude-3*"

        - Effect: Allow
          Action:
            - kms:Decrypt
          Resource: "*"

  # Environment variables
  environment:
    NODE_ENV: ${self:provider.stage}
    DB_HOST: ${env:DB_HOST}
    DB_PORT: ${env:DB_PORT}
    DB_NAME: ${env:DB_NAME}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    JWT_SECRET: ${env:JWT_SECRET}
    AWS_REGION: ${self:provider.region}
    AWS_ACCESS_KEY_ID: ${env:AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${env:AWS_SECRET_ACCESS_KEY}
    S3_BUCKET: ${env:S3_BUCKET}
    S3_REGION: ${env:S3_REGION}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true
    timeout: 30
    memorySize: 512
    ephemeralStorage:
      size: 512
    vpc:
      securityGroupIds:
        - ${env:LAMBDA_SECURITY_GROUP_ID, ''}
      subnetIds:
        - ${env:LAMBDA_SUBNET_ID_1, ''}
        - ${env:LAMBDA_SUBNET_ID_2, ''}
    layers:
      - arn:aws:lambda:${self:provider.region}:${aws:accountId}:layer:node-modules:1

# Plugins
plugins:
  - serverless-offline
  - serverless-plugin-typescript

# Packaging
package:
  individually: false
  patterns:
    - '!node_modules/serverless/**'
    - '!.git/**'
    - '!.env'
    - '!README.md'

# Custom settings
custom:
  serverless-offline:
    httpPort: 3001
    websocketPort: 3001
    lambdaPort: 3002

  # TypeScript settings
  typescript:
    lib: ['es2020']
    noImplicitAny: true
    strictNullChecks: true
    sourceMap: true
    allowSyntheticDefaultImports: true
    esModuleInterop: true

# Outputs
outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  LambdaFunctionArn:
    Description: "Lambda function ARN"
    Value: !GetAtt ApiLambdaFunction.Arn

  LambdaFunctionRole:
    Description: "IAM role for Lambda function"
    Value: !GetAtt IamRoleLambdaExecution.Arn
