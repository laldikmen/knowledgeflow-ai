service: knowledgeflow-ai-backend

frameworkVersion: '3'

# Load environment variables from .env at deploy time so ${env:...} resolves
# to the real DB / S3 / JWT config instead of the localhost defaults.
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'eu-central-1'}
  stage: ${opt:stage, 'dev'}

  # Let API Gateway return the report PDF as binary (base64) instead of mangling it.
  apiGateway:
    binaryMediaTypes:
      - 'application/pdf'

  # VPC Configuration - Lambda in same VPC as RDS for secure database access
  vpc:
    securityGroupIds:
      - ${env:LAMBDA_SECURITY_GROUP_ID}  # Lambda security group
    subnetIds:
      - ${env:LAMBDA_SUBNET_ID_1}
      - ${env:LAMBDA_SUBNET_ID_2}
      - ${env:LAMBDA_SUBNET_ID_3}

  # IAM Role with necessary permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:${self:provider.region}:*:*
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:provider.environment.S3_BUCKET}
            - arn:aws:s3:::${self:provider.environment.S3_BUCKET}/*
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: "*"
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:*:secret:knowledgeflow/*

  # Environment variables (AWS credentials are set via IAM role, not here)
  environment:
    NODE_ENV: ${self:provider.stage}
    DB_HOST: ${env:DB_HOST, 'localhost'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_NAME: ${env:DB_NAME, 'knowledgeflow_ai'}
    DB_USER: ${env:DB_USER, 'postgres'}
    DB_PASSWORD: ${env:DB_PASSWORD, 'password'}
    JWT_SECRET: ${env:JWT_SECRET, 'dev-secret'}
    S3_BUCKET: ${env:S3_BUCKET, 'knowledgeflow-ai-dev'}
    S3_REGION: ${env:S3_REGION, 'eu-central-1'}
    # Email (Amazon SES). EMAIL_ENABLED=true turns on real delivery; the sender
    # must be a verified SES identity in SES_REGION. FRONTEND_URL builds the link.
    EMAIL_ENABLED: ${env:EMAIL_ENABLED, 'false'}
    EMAIL_FROM: ${env:EMAIL_FROM, 'no-reply@knowledgeflow.ai'}
    SES_REGION: ${env:SES_REGION, 'eu-central-1'}
    FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:5173'}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true
    timeout: 30
    memorySize: 512

  # Daily task digest: emails each user their overdue/upcoming action items and
  # writes in-app notifications. Runs at 07:00 UTC every day.
  digest:
    handler: dist/jobs/digest.handler
    events:
      - schedule: cron(0 7 * * ? *)
    timeout: 120
    memorySize: 512

# Packaging - use pre-compiled dist folder.
# Exclude build-only tooling from the Lambda bundle: the code ships precompiled
# in dist/, so the TypeScript compiler is never needed at runtime. Dropping it
# keeps the unzipped package under Lambda's 250 MiB limit.
package:
  individually: false
  patterns:
    - 'dist/**'
    - 'node_modules/**'
    - '!node_modules/serverless/**'
    - '!node_modules/typescript/**'
    - '!node_modules/@typescript/**'
    # Non-runtime files: TypeScript declarations and source maps are never
    # loaded by Node at runtime but add ~85 MB. Excluding them keeps the
    # unzipped package comfortably under Lambda's 250 MiB limit.
    - '!node_modules/**/*.d.ts'
    - '!node_modules/**/*.map'
    - '!node_modules/**/*.md'
    - '!.git/**'
